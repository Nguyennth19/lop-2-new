<script>
/* Phase3 QA — run phase3GradeDOMQA() from Apps Script browser Console.
 * All generated elements are detached; currentUser stars/rewards restored.
 * This runs production evaluateScope(), not a reimplemented scoring algorithm.
 */
function phase3GradeDOMQA() {
  const savedStars=currentUser.stars;
  const savedRewards=JSON.parse(JSON.stringify(currentUser.rewardedItems||{}));
  const savedDrafts=JSON.parse(JSON.stringify(currentUser.drafts||{}));
  const results=[];
  const verify=(name,container,inputs,expected)=>{
    try {
      const all=Array.from(container.querySelectorAll('.lvl-input, .carry-input'));
      all.forEach((el,i)=>{ el.value=inputs[i]===null?'':String(inputs[i]); });
      const r=evaluateScope(container);
      const ok=r.total===expected.total && r.correctCount===expected.correct &&
        r.wrongCount===expected.wrong && r.emptyCount===expected.empty;
      results.push({name,pass:ok,actual:r,expected});
    }catch(e){results.push({name,pass:false,error:String(e)});}
  };
  const root=html=>{const el=document.createElement('div');el.innerHTML=html;return el;};
  const setAllCorrect=el=>Array.from(el.querySelectorAll('.lvl-input,.carry-input'))
    .map(x=>x.dataset.ans||x.dataset.expected||'');
  try {
    const vertical=root(renderStandardVerticalCard({
      l:'QA',theme:'pink',n1:28,n2:15,op:'+',ans:43},'QA_V'));
    const goodV=setAllCorrect(vertical);
    verify('vertical-correct',vertical,goodV,{total:3,correct:3,wrong:0,empty:0});
    verify('vertical-empty',vertical,[null,null,null],{total:3,correct:0,wrong:0,empty:3});
    verify('vertical-wrong',vertical,['0','0','0'],{total:3,correct:0,wrong:3,empty:0});
    const mental=root('<div data-prob-id="QA_M"><input class="lvl-input" data-type="num" data-ans="30" /></div>');
    verify('mental-correct',mental,['30'],{total:1,correct:1,wrong:0,empty:0});
    verify('mental-wrong',mental,['31'],{total:1,correct:0,wrong:1,empty:0});
    const word=root('<div data-prob-id="QA_W">'+renderStructuredWordProblemSolution({
      tomTat:'12 + 19',solveTxt:'Có tất cả số viên bi là:',n1:12,n2:19,
      op:'+',ansNum:31,unit1:'(viên bi)',unit2:'viên bi'})+'</div>');
    const wordInputs=Array.from(word.querySelectorAll('.lvl-input'));
    const w=wordInputs.map(x=>x.dataset.ans);
    verify('word-correct',word,w,{total:5,correct:5,wrong:0,empty:0});
    verify('word-empty',word,[null,null,null,null,null],{total:5,correct:0,wrong:0,empty:5});
    const puzzle=root(renderVerticalPuzzleCard({l:'QA',theme:'blue',op:'+',sum:43,
      rows:[['2',{ans:8}],[{ans:1},'5'],['4','3']]},'QA_P'));
    verify('puzzle-correct',puzzle,['8','1'],{total:2,correct:2,wrong:0,empty:0});
    verify('puzzle-empty',puzzle,[null,null],{total:2,correct:0,wrong:0,empty:2});
  }finally {
    currentUser.stars=savedStars;
    currentUser.rewardedItems=savedRewards;
    currentUser.drafts=savedDrafts;
    saveDataImmediate();
  }
  const report={status:results.every(x=>x.pass)?'PASS':'FAIL',passed:results.filter(x=>x.pass).length,
    total:results.length,results};
  console.table(results.map(x=>({test:x.name,pass:x.pass,error:x.error||''})));
  console.log('PHASE3_DOM_QA_RESULT',JSON.stringify(report));
  return report;
}

/* Comprehensive Phase 3 regression. In-memory user state is restored in finally.
 * Run in an isolated QA browser profile because localStorage is shared with the app.
 */
function phase3FinalRegressionQA() {
  const backup=JSON.parse(JSON.stringify(currentUser));
  const activeLevel=currentLevel;
  const results=[];
  const record=(name,ok,detail)=>results.push({name,pass:!!ok,detail:detail||''});
  const el=html=>{const x=document.createElement('div');x.innerHTML=html;return x;};
  const attempt=(name,html,values,expected)=>{
    const node=el(html),inp=Array.from(node.querySelectorAll('.lvl-input,.carry-input'));
    inp.forEach((x,i)=>{x.value=values[i]==null?'':String(values[i]);});
    const score=evaluateScope(node);
    record(name,score.correctCount===expected[0]&&score.wrongCount===expected[1]&&
      score.emptyCount===expected[2]&&score.total===expected[3],
      JSON.stringify({correct:score.correctCount,wrong:score.wrongCount,empty:score.emptyCount,total:score.total}));
  };
  try {
    currentUser.rewardedItems={};
    currentUser.stars=0;
    const vertical=renderStandardVerticalCard({l:'QA',theme:'pink',n1:28,n2:15,op:'+',ans:43},'QA_PARTIAL_V');
    attempt('partial-vertical',vertical,['1',null,'3'],[2,0,1,3]);
    attempt('wrong-carry-vertical',vertical,['0','4','3'],[2,1,0,3]);
    const word='<div data-prob-id="QA_PARTIAL_W">'+renderStructuredWordProblemSolution({
      tomTat:'12 + 19',solveTxt:'Tổng số viên bi là:',n1:12,n2:19,
      op:'+',ansNum:31,unit1:'(viên bi)',unit2:'viên bi'})+'</div>';
    attempt('partial-word',word,['12','+','19',null,'31'],[4,0,1,5]);
    attempt('wrong-word-operation',word,['12','-','19','31','31'],[3,2,0,5]);
    const puzzle=renderVerticalPuzzleCard({l:'QA',theme:'blue',op:'+',sum:43,
      rows:[['2',{ans:8}],[{ans:1},'5'],['4','3']]},'QA_PARTIAL_P');
    attempt('partial-puzzle',puzzle,['8',null],[1,0,1,2]);
    // Reward is once per immutable question, regardless of RUN suffix.
    const card=run=>'<div data-reward-owner="Q_REWARD"><div data-prob-id="Q_REWARD__RUN_'+run+'">'+
      '<input class="lvl-input" data-type="num" data-ans="30" value="30"></div></div>';
    const first=el(card(1)),second=el(card(2));
    first.querySelector('input').value='30';second.querySelector('input').value='30';
    const a=evaluateScope(first),b=evaluateScope(second);
    record('reward-idempotent-across-runs',a.newlyRewardedStars===2&&b.newlyRewardedStars===0&&currentUser.stars===2,
      JSON.stringify({first:a.newlyRewardedStars,second:b.newlyRewardedStars,stars:currentUser.stars}));
    // Draft roundtrip: test actual storage key and both per-run namespaces.
    const key='QA_FINAL_'+Date.now();
    const draft1=key+'__RUN_1_num_0',draft2=key+'__RUN_2_num_0';
    currentUser.drafts.lv1={[draft1]:'30',[draft2]:'49'};
    const restored=JSON.parse(JSON.stringify(currentUser));
    record('draft-serialization-and-run-isolation',
      restored.drafts.lv1[draft1]==='30'&&restored.drafts.lv1[draft2]==='49');
    // Render views for each level through the real generic registry and ensure
    // switching views does not alter the current run or snapshots.
    if(window.LessonGenericRenderer&&window.LessonGenericRenderer.isActive()){
      const stateBefore=JSON.stringify(currentUser.practiceRuns||{});
      const htmls=[1,2,3].map(lv=>window.LessonGenericRenderer.render(lv));
      record('lv1-lv2-lv3-render',htmls.every(h=>typeof h==='string'&&h.includes('section'))||
        htmls.every(h=>typeof h==='string'&&h.length>0));
      record('level-switch-does-not-change-run',
        JSON.stringify(currentUser.practiceRuns||{})===stateBefore);
    }else record('generic-renderer-ready',false,'NOT_READY: Enter QA lesson LV1, wait until sections appear, then rerun');
    // Validate API errors without mutating global lesson data or calling backend.
    const bad={status:'success',lesson:{title:'QA'},sections:[{section_id:'X',level:1,
      title:'X',exercise_type:'MENTAL_ADD',sort_order:1}],
      questions:[{question_id:'Q',section_id:'MISSING',question_type:'MENTAL_ADD',
        payload:{n1:2,n2:3,answer:5},sort_order:1}]};
    let rejected=false;
    try{window.LessonGenericRenderer.initialize(bad);}catch(e){rejected=true;}
    record('invalid-api-orphan-question-rejected',rejected);
  }catch(e){
    record('suite-unhandled-exception',false,String(e));
  }finally{
    // Restore the prior profile, reward ledger, drafts and run pointers.
    Object.keys(currentUser).forEach(k=>delete currentUser[k]);
    Object.assign(currentUser,backup);
    saveDataImmediate();
  }
  const report={status:results.length>=9&&results.every(t=>t.pass)?'PASS':'FAIL',
    passed:results.filter(t=>t.pass).length,total:results.length,results};
  console.table(results);
  console.log('PHASE3_FINAL_REGRESSION_RESULT',JSON.stringify(report));
  return report;
}
</script>
