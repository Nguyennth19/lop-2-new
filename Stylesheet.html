<style>
  :root {
    --font-display: 'Baloo 2', cursive, sans-serif;
    --font-body: 'Quicksand', sans-serif;
    --font-math: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 30%, #fef9c3 70%, #dcfce7 100%);
    min-height: 100vh;
    color: #020617;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }

  .font-baloo { font-family: var(--font-display); }
  .font-math { font-family: var(--font-math); }

  /* Chữ 3D viền trắng kép phong cách tiểu học */
  .title-3d-pink {
    font-family: var(--font-display);
    font-weight: 800;
    color: #ff2a6d;
    paint-order: stroke fill;
    -webkit-text-stroke: 7px #ffffff;
    filter: drop-shadow(0 4px 0 #be123c) drop-shadow(0 8px 10px rgba(0,0,0,0.15));
  }

  .wood-board {
    background: linear-gradient(180deg, #fde047 0%, #facc15 50%, #f59e0b 100%);
    border: 3px solid #92400e;
    box-shadow: 0 4px 0 #78350f, inset 0 2px 0 rgba(255, 255, 255, 0.6);
  }

  /* =====================================================================
     KHÓA LƯỚI VỞ Ô LY TIỂU HỌC: NÉT THANH MỜ NHẸ 2 CẤP ĐỘ
  ===================================================================== */
  .vo-oly-grid {
    background-color: #ffffff;
    background-image:
      linear-gradient(to right, rgba(56, 189, 248, 0.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.16) 1px, transparent 1px),
      linear-gradient(to right, rgba(186, 230, 253, 0.12) 0.5px, transparent 0.5px),
      linear-gradient(to bottom, rgba(186, 230, 253, 0.12) 0.5px, transparent 0.5px);
    background-size: 28px 28px, 28px 28px, 7px 7px, 7px 7px;
    background-position: -1px -1px;
    border: 1.5px solid rgba(56, 189, 248, 0.28);
  }

  /* =====================================================================
     KHÓA DÒNG ĐIỀN LỜI VĂN (.oly-blank): GẠCH CHÂN MỜ & ĐỔ NỀN MÀU KHI CHẤM
  ===================================================================== */
  .oly-blank {
    border: none;
    border-bottom: 2px dashed rgba(2, 132, 199, 0.55);
    font-family: var(--font-math);
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 6px 6px 0 0;
    outline: none;
    text-align: center;
    transition: all 0.2s ease;
    min-width: 0;
  }
  .oly-blank:focus {
    background-color: rgba(254, 249, 195, 0.85);
    border-bottom: 2px solid #0284c7;
    box-shadow: 0 2px 0 rgba(2, 132, 199, 0.25);
  }

  /* =====================================================================
     KHÓA KIẾN TRÚC PHÉP TÍNH DỌC & LƯỚI 5 CỘT TÍNH NHẨM
  ===================================================================== */
  .calc-box {
    font-family: var(--font-math);
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .vertical-math-matrix {
    display: grid;
    grid-template-columns: 22px 36px 36px;
    align-items: center;
    justify-items: center;
    width: 94px;
    margin: 0 auto;
  }

  .mental-math-grid {
    display: grid;
    grid-template-columns: 78px 18px 36px 18px 56px;
    align-items: center;
    justify-items: center;
    width: 100%;
    max-width: 214px;
    margin: 0 auto;
  }

  .rtl-step-active {
    box-shadow: 0 0 0 3.5px rgba(250, 204, 21, 0.85);
    transform: scale(1.05);
  }

  /* =====================================================================
     NÂNG CẤP CÔNG THÁI HỌC BÀN PHÍM TOÁN HỌC (MOBILE 3x5 & CHÂN TRANG)
     - Tách hoàn toàn khỏi module bài học (không đè lên nút Nộp bài)
     - Ma trận 3 hàng x 5 cột trên Mobile (< 640px):
       + Bên trái (Cột 1-3 & Cột 4 Hàng 3): Các phím số 0 - 9
       + Bên phải (Cột 4 Hàng 1-2 & Cột 5): Các phím chức năng +, -, Xóa, Tiếp
  ===================================================================== */
  .keypad-footer-dock {
    position: sticky;
    bottom: 0;
    z-index: 40;
    width: 100%;
    max-width: 64rem; /* Đồng bộ max-w-5xl với khung bài học */
    margin-top: 0.75rem;
    border-radius: 1.5rem 1.5rem 0 0;
  }

  .touch-key {
    min-height: 52px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.08s ease;
  }
  .touch-key:active {
    transform: translateY(3px) scale(0.97);
  }

  .keypad-matrix {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(52px, auto));
    gap: 0.5rem;
  }

  /* Định vị ma trận 3 hàng x 5 cột trên thiết bị di động (< 640px) */
  @media (max-width: 639px) {
    /* Cụm phím số (0-9) bên trái */
    .keypad-matrix [data-kpos="1"] { grid-column: 1; grid-row: 1; }
    .keypad-matrix [data-kpos="2"] { grid-column: 2; grid-row: 1; }
    .keypad-matrix [data-kpos="3"] { grid-column: 3; grid-row: 1; }

    .keypad-matrix [data-kpos="4"] { grid-column: 1; grid-row: 2; }
    .keypad-matrix [data-kpos="5"] { grid-column: 2; grid-row: 2; }
    .keypad-matrix [data-kpos="6"] { grid-column: 3; grid-row: 2; }

    .keypad-matrix [data-kpos="7"] { grid-column: 1; grid-row: 3; }
    .keypad-matrix [data-kpos="8"] { grid-column: 2; grid-row: 3; }
    .keypad-matrix [data-kpos="9"] { grid-column: 3; grid-row: 3; }
    .keypad-matrix [data-kpos="0"] { grid-column: 4; grid-row: 3; }

    /* Cụm phím chức năng (+, -, Xóa, Tiếp) to rõ ở bên phải */
    .keypad-matrix [data-kpos="plus"]  { grid-column: 4; grid-row: 1; }
    .keypad-matrix [data-kpos="minus"] { grid-column: 4; grid-row: 2; }
    .keypad-matrix [data-kpos="del"]   { grid-column: 5; grid-row: 1; }
    .keypad-matrix [data-kpos="next"]  {
      grid-column: 5;
      grid-row: 2 / span 2;
      min-height: 112px;
    }
  }

  /* Trên máy tính bảng & Desktop (>= 640px): Dàn 1 hàng 14 cột gọn gàng */
  @media (min-width: 640px) {
    .keypad-matrix {
      grid-template-columns: repeat(14, minmax(0, 1fr));
      grid-template-rows: minmax(50px, auto);
      gap: 0.5rem;
    }
  }

  .key-highlight-pulse {
    animation: keyPulse 1.1s infinite ease-in-out;
  }
  @keyframes keyPulse {
    0%, 100% { box-shadow: 0 3px 0 #e11d48, 0 0 0 0 rgba(244, 63, 94, 0.5); }
    50% { box-shadow: 0 3px 0 #e11d48, 0 0 0 6px rgba(244, 63, 94, 0); }
  }

  .btn-3d { transition: all 0.15s ease; }
  .btn-3d:active { transform: translateY(3px); }

  @keyframes bounceSoft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .animate-bounce-soft { animation: bounceSoft 2s infinite ease-in-out; }
</style>
