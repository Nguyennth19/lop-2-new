name: LOP2 All-in-One Runner CI
on:
  pull_request:
    paths:
      - 'all-in-one-1406/**'
      - 'RUN_ALL.bat'
      - 'CHECK_ONLY.bat'
      - 'RESTORE_BACKUP.bat'
      - 'BACKUP_NOW.bat'
      - '.github/workflows/lop2-all-in-one-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies without private documents
        run: python -m pip install -r all-in-one-1406/requirements.txt
      - name: Validate SQLite checkpoint, backup, resume and source guards
        run: python -m unittest discover -s all-in-one-1406/tests -v
      - name: Ensure no original source documents or private state committed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          paths=check_output(['git','ls-files'],text=True).splitlines()
          forbidden={'.pdf','.xlsx','.xls','.db','.sqlite3','.pem','.key','.jsonl'}
          flagged=[p for p in paths if Path(p).suffix.lower() in forbidden]
          private=[p for p in paths if any(x in ('PRIVATE_INPUTS','LOCAL_STATE','BACKUPS') for x in Path(p).parts)]
          if flagged or private:raise SystemExit('PRIVATE_SOURCE_FILES_COMMITTED:'+repr(flagged+private))
          print('Private source material: none committed')
          PY