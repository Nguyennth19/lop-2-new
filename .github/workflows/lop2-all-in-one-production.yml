name: LOP2 All-in-One 1406 (private, gated)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight only, or gated processing of all source candidates'
        type: choice
        options: [preflight, canary, run-all]
        default: preflight
        required: true
      campaign:
        description: 'Stable, unique campaign ID; same value resumes after interruption'
        type: string
        default: lop2-source-v2-20261109
        required: true
      segment:
        description: 'Automatic continuation generation; maximum 50 segments'
        type: number
        default: 1
        required: true

# This workflow requires merge to main, a protected environment, external private storage,
# and explicit LOP2_ENABLE_FULL_RUN=YES plus a prior successful live canary gate.
# Do not run on PRs or source content on public logs.
permissions:
  contents: read
  actions: write
concurrency:
  group: lop2-prod-${{ inputs.campaign }}
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    environment: lop2-private
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.LOP2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.LOP2_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.LOP2_S3_REGION || 'auto' }}
      LOP2_S3_ENDPOINT: ${{ vars.LOP2_S3_ENDPOINT }}
      LOP2_S3_BUCKET: ${{ secrets.LOP2_S3_BUCKET }}
      LOP2_S3_PREFIX: ${{ vars.LOP2_S3_PREFIX || 'lop2-private' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LOP2_VISION_MODEL: ${{ vars.LOP2_VISION_MODEL }}
      LOP2_INPUT_DIR: ${{ runner.temp }}/lop2-private
      LOP2_CAMPAIGN: ${{ inputs.campaign }}
      LOP2_ALLOW_RUN: ${{ (inputs.mode == 'canary' || (inputs.mode == 'run-all' && vars.LOP2_ENABLE_FULL_RUN == 'YES')) && 'YES' || 'NO' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: all-in-one-1406/requirements.txt
      - name: Install runtime libraries
        run: pip install --requirement all-in-one-1406/requirements.txt
      - name: Check configuration before touching private content
        shell: bash
        run: |
          test -n "$LOP2_S3_BUCKET" || { echo 'S3_BUCKET_MISSING'; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'S3_ACCESS_KEY_MISSING'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'S3_SECRET_KEY_MISSING'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'VISION_API_KEY_MISSING'; exit 1; }
          test -n "$LOP2_VISION_MODEL" || { echo 'VISION_MODEL_MISSING'; exit 1; }
          if [ '${{ inputs.mode }}' = 'run-all' ]; then
            test "$LOP2_ALLOW_RUN" = YES || { echo 'FULL_RUN_NOT_APPROVED'; exit 1; }
          fi
          if [ '${{ inputs.segment }}' -gt 50 ]; then echo 'SEGMENT_LIMIT_REACHED'; exit 1; fi
      - name: Download private manifest and verified source PDFs
        run: python all-in-one-1406/download_inputs.py
      - name: One-time source and external-checkpoint preflight
        run: |
          python all-in-one-1406/runner.py \
            --manifest "$LOP2_INPUT_DIR/SOURCE_1406.csv" \
            --pdf-root "$LOP2_INPUT_DIR" \
            --campaign "$LOP2_CAMPAIGN" --store s3 \
            --mode preflight --summary-file "$RUNNER_TEMP/preflight.json"
      - name: Probe real S3-compatible storage (write/read/list/delete)
        run: |
          python all-in-one-1406/cloud_gates.py --campaign "$LOP2_CAMPAIGN" --action probe
      - name: Check real model credentials without generating question content
        run: python all-in-one-1406/model_probe.py
      - name: Live canary - create one machine draft from a real locked source page
        if: inputs.mode == 'canary'
        run: |
          python all-in-one-1406/runner.py \
            --manifest "$LOP2_INPUT_DIR/SOURCE_1406.csv" \
            --pdf-root "$LOP2_INPUT_DIR" --campaign "$LOP2_CAMPAIGN" \
            --store s3 --mode run --only-source-id SGK_B001_K1_E01 \
            --max-items 1 --max-seconds 900 --retry-exceptions \
            --summary-file "$RUNNER_TEMP/lop2-canary.json"
      - name: Seal canary gate after read-back of a real draft
        if: inputs.mode == 'canary'
        run: |
          python all-in-one-1406/cloud_gates.py \
            --campaign "$LOP2_CAMPAIGN" --action mark-canary \
            --manifest "$LOP2_INPUT_DIR/SOURCE_1406.csv"
      - name: Block full production until canary gate is verified in S3
        if: inputs.mode == 'run-all'
        run: |
          python all-in-one-1406/cloud_gates.py \
            --campaign "$LOP2_CAMPAIGN" --action check-canary \
            --manifest "$LOP2_INPUT_DIR/SOURCE_1406.csv"
      - name: Process one resumable segment
        id: content
        if: inputs.mode == 'run-all'
        shell: bash
        run: |
          python all-in-one-1406/runner.py \
            --manifest "$LOP2_INPUT_DIR/SOURCE_1406.csv" \
            --pdf-root "$LOP2_INPUT_DIR" \
            --campaign "$LOP2_CAMPAIGN" --store s3 \
            --mode run --max-items 35 --max-seconds 15600 \
            --summary-file "$RUNNER_TEMP/lop2-summary.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'lop2-summary.json').read_text())
          more=d['remaining']>0 and d['this_invocation_processed']>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"more={'true' if more else 'false'}\n")
          print('Remaining candidates:',d['remaining'])
          PY
      - name: Dispatch next resumable segment
        if: steps.content.outputs.more == 'true' && inputs.segment < 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT_SEGMENT=$(( ${{ inputs.segment }} + 1 ))
          gh workflow run lop2-all-in-one-production.yml --ref main \
            -f mode=run-all \
            -f campaign="$LOP2_CAMPAIGN" \
            -f segment="$NEXT_SEGMENT"
      - name: Stop if continuation limit was reached
        if: steps.content.outputs.more == 'true' && inputs.segment >= 50
        run: |
          echo 'CONTINUATION_LIMIT_REACHED — resume manually after inspection'
          exit 1
      - name: Avoid storing source PDFs as artifacts
        if: always()
        run: |
          if [ -d "$LOP2_INPUT_DIR" ]; then rm -rf "$LOP2_INPUT_DIR"; fi