function ensureAnalyticsStructure() {
  if (!currentUser.analytics) {
    currentUser.analytics = {

      errorCounts: { FORGOT_CARRY: 0, REVERSED_DIGITS: 0, LEFT_TO_RIGHT_ORDER: 0, WRONG_ONES: 0, WRONG_TENS: 0 }

  }
  if (!currentUser.analytics.attemptHistory) currentUser.analytics.attemptHistory = {};
  if (!currentUser.analytics.errorCounts) {
    currentUser.analytics.errorCounts = { FORGOT_CARRY: 0, REVERSED_DIGITS: 0, LEFT_TO_RIGHT_ORDER: 0, WRONG_ONES: 0, WRONG_TENS: 0 };

}

function saveDataImmediate() {
  if (saveDebounceTimer) { clearTimeout(saveDebounceTimer); saveDebounceTimer = null; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); } catch (e) {}
}

function saveDataDebounced() {
  if (saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); } catch (e) {}
    saveDebounceTimer = null;
  }, 300);
}

// 3. ĐỒNG BỘ DỮ LIỆU TỪ GOOGLE SHEETS VÀ RENDER GIAO DIỆN TỨC THÌ
function mergeSheetsData(response) {
  if (!response) return;

  // Hỗ trợ cả cấu trúc trả về mới (rowsPhepTinh, rowsLoiVan) và cấu trúc cũ (data.lv1.ex1)
  if (response.data && response.data.lv1) {
    if (Array.isArray(response.data.lv1.ex1) && response.data.lv1.ex1.length > 0) {
      window.LESSON_DATA.lv1.ex1 = response.data.lv1.ex1;
    }
    if (response.data.lv3 && Array.isArray(response.data.lv3.ex1) && response.data.lv3.ex1.length > 0) {
      window.LESSON_DATA.lv3.ex1 = response.data.lv3.ex1;
    }
  }

  if (Array.isArray(response.rowsPhepTinh) && response.rowsPhepTinh.length > 0) {
    const lv1Ex1 = [], lv3Ex1 = [];
    const labels6 = ['a)', 'b)', 'c)', 'd)', 'e)', 'g)'];
    const labels10 = ['a)', 'b)', 'c)', 'd)', 'e)', 'f)', 'g)', 'h)', 'i)', 'k)'];

    response.rowsPhepTinh.forEach(row => {
      const level = String(row[0] || '').trim();
      const bai = String(row[1] || '').trim();
      const n1 = parseInt(row[3], 10);
      const n2 = parseInt(row[4], 10);
      const op = String(row[5] || '+').trim();
      const ans = parseInt(row[6], 10);

      if (level === 'LV1' && bai === 'Bài 1' && !isNaN(n1) && !isNaN(n2)) {
        const idx = lv1Ex1.length;
        lv1Ex1.push({ l: labels6[idx] || (idx + 1) + ')', n1, n2, op, ans: isNaN(ans) ? (n1 + n2) : ans, theme: THEME_KEYS[idx % 6] });
      } else if (level === 'LV3' && bai === 'Bài 1' && !isNaN(n1) && !isNaN(n2)) {
        const idx = lv3Ex1.length;
        lv3Ex1.push({ l: labels10[idx] || (idx + 1) + ')', n1, n2, op, ans: isNaN(ans) ? (n1 + n2) : ans, theme: THEME_KEYS[idx % 6] });
      }
    });

    if (lv1Ex1.length > 0) window.LESSON_DATA.lv1.ex1 = lv1Ex1;
    if (lv3Ex1.length > 0) window.LESSON_DATA.lv3.ex1 = lv3Ex1;
  }

  if (Array.isArray(response.rowsLoiVan) && response.rowsLoiVan.length > 0) {
    let lv1Idx = 0, lv2Idx = 0;
    response.rowsLoiVan.forEach(row => {
      const level = String(row[0] || '').trim();
      const moTa = String(row[2] || '').trim();
      const tomTat = String(row[3] || '').trim();
      const loiGiai = String(row[4] || '').trim();
      const n1 = parseInt(row[5], 10);
      const op = String(row[6] || '+').trim();
      const n2 = parseInt(row[7], 10);
      const ans = parseInt(row[8], 10);
      const donVi = String(row[9] || '').trim();

      if (level === 'LV1' && window.LESSON_DATA.lv1.ex3[lv1Idx] && !isNaN(n1) && !isNaN(n2)) {
        const target = window.LESSON_DATA.lv1.ex3[lv1Idx];
        if (moTa) target.desc = moTa;
        if (tomTat) target.tomTat = tomTat;
        if (loiGiai) target.solveTxt = loiGiai;
        target.n1 = n1; target.op = op; target.n2 = n2;
        target.ansNum = isNaN(ans) ? (n1 + n2) : ans;
        if (donVi) { target.unit1 = `(${donVi})`; target.unit2 = donVi; }
        lv1Idx++;
      } else if (level === 'LV2' && window.LESSON_DATA.lv2.problems[lv2Idx] && !isNaN(n1) && !isNaN(n2)) {
        const target = window.LESSON_DATA.lv2.problems[lv2Idx];
        if (moTa) target.desc = moTa;
        if (tomTat) target.tomTat = tomTat;
        if (loiGiai) target.solveTxt = loiGiai;
        target.n1 = n1; target.op = op; target.n2 = n2;
        target.ansNum = isNaN(ans) ? (n1 + n2) : ans;
        if (donVi) { target.unit1 = `(${donVi})`; target.unit2 = donVi; }
        lv2Idx++;
      }
    });
  }
}

function renderCurrentLevelDOM(level) {
  const container = document.getElementById('lesson-dynamic-container');
  if (!container) return;

  let htmlContent = '';
  if (level === 1 && typeof getHTML_LV1 === 'function') htmlContent = getHTML_LV1();
  else if (level === 2 && typeof getHTML_LV2 === 'function') htmlContent = getHTML_LV2();
  else if (level === 3 && typeof getHTML_LV3 === 'function') htmlContent = getHTML_LV3();

  if (htmlContent) {
    container.innerHTML = htmlContent;
    const inputName = document.getElementById(`header-name-lv${level}`);
    const inputClass = document.getElementById(`header-class-lv${level}`);
    if (inputName) inputName.value = currentUser.name || '';
    if (inputClass) inputClass.value = currentUser.class || '';
    if (window.LessonAdapter && typeof window.LessonAdapter.bindStableIds === 'function') {
      window.LessonAdapter.bindStableIds(container, level, currentUser);
    }
    bindAndRestoreLevelState(level);
  }
}

// DEVELOPMENT ONLY: phase 2 structured data integration on non-production branch.
const PHASE2_SHEETS_ADAPTER = true;
let phase2Loading = false;
function loadLessonDataFromGAS(level) {
  renderCurrentLevelDOM(level);
  if (isSheetSynced || phase2Loading || typeof google === 'undefined' ||
      !google.script || !google.script.run) return;
  phase2Loading = true;
  google.script.run
    .withSuccessHandler(function(response) {
      phase2Loading = false;
      if (PHASE2_SHEETS_ADAPTER && response && response.status === 'success') {
        try {
          const transformed = window.LessonAdapter.apply(response, window.LESSON_DATA);
          // Never discard answers currently typed while a remote fetch was in flight.
          const container = document.getElementById('lesson-dynamic-container');
          const hasTypedAnswer = !!(container && Array.from(
            container.querySelectorAll('.lvl-input, .carry-input')
          ).some(el => el.value && el.value.trim() !== ''));
          window.LESSON_DATA = transformed;
          isSheetSynced = true;
          if (!hasTypedAnswer) renderCurrentLevelDOM(currentLevel);
          else console.info('Lesson data updated for next level navigation; active inputs preserved.');
        } catch (e) {
          console.error('Phase2 adapter rejected lesson data; legacy cards preserved:', e);
        }
      } else {
        console.warn('Structured API unavailable; legacy lesson remains in use:', response);
      }
    })
    .withFailureHandler(function(error) {
      phase2Loading = false;
      console.warn('Structured Sheets API failed; legacy lesson remains in use:', error);
    })
    .getLessonData('MATH_B020');
}

function bindAndRestoreLevelState(level) {
  const lvKey = 'lv' + level;
  const savedDrafts = (currentUser.drafts && currentUser.drafts[lvKey]) ? currentUser.drafts[lvKey] : {};

  document.querySelectorAll('#lesson-dynamic-container [data-prob-id]').forEach(probEl => {
    const probId = probEl.dataset.probId;
    const roleCounters = {};
    probEl.querySelectorAll('.lvl-input, .carry-input').forEach(inp => {
      let roleTag = inp.dataset.role || inp.dataset.col || inp.dataset.type || 'inp';
      if (inp.dataset.type === 'digit' && inp.dataset.row !== undefined && inp.dataset.col !== undefined) {
        roleTag = `r${inp.dataset.row}c${inp.dataset.col}`;
      }
      roleCounters[roleTag] = (roleCounters[roleTag] || 0);
      const semanticKey = `${probId}_${roleTag}_${roleCounters[roleTag]}`;
      roleCounters[roleTag]++;
      inp.dataset.draftKey = semanticKey;
      if (savedDrafts[semanticKey] !== undefined) {
        inp.value = savedDrafts[semanticKey];
      }
    });

    if (currentUser.rewardedItems && currentUser.rewardedItems[probId]) {
      const badge = probEl.querySelector('.prob-star-badge');
      if (badge) badge.classList.remove('hidden');
    }
  });

  if (typeof applyTouchInputModeToAllInputs === 'function') applyTouchInputModeToAllInputs();
}

function focusVerticalCardStart(cardEl, event) {
  if (event && event.target && event.target.tagName === 'INPUT') {
    const clickedInput = event.target;
    if (clickedInput.dataset.col === 'tens') {
      const onesInp = cardEl.querySelector('input[data-col="ones"]');
      if (onesInp && onesInp.value.trim() === '' && clickedInput.value.trim() === '') {
        event.preventDefault();
        onesInp.focus();
      }
    }
    return;
  }
  const onesInp = cardEl.querySelector('input[data-col="ones"]');
  const carryInp = cardEl.querySelector('input[data-role="carry"]');
  const tensInp = cardEl.querySelector('input[data-col="tens"]');
  if (onesInp && onesInp.value.trim() === '') onesInp.focus();
  else if (carryInp && carryInp.value.trim() === '' && tensInp && tensInp.value.trim() === '') carryInp.focus();
  else if (tensInp) tensInp.focus();
}

function focusPuzzleCardStart(cardEl, event) {
  if (event && event.target && event.target.tagName === 'INPUT') return;
  const inputs = Array.from(cardEl.querySelectorAll('.lvl-input[data-type="digit"]'));
  if (inputs.length === 0) return;
  const emptyOnes = inputs.find(i => i.dataset.col === '1' && i.value.trim() === '');
  if (emptyOnes) { emptyOnes.focus(); return; }
  const firstEmpty = inputs.find(i => i.value.trim() === '');
  if (firstEmpty) { firstEmpty.focus(); return; }
  inputs[0].focus();
}

function keypadPress(key) {
  playKeyClickSound();
  if (!lastFocusedInput || !document.body.contains(lastFocusedInput)) {
    const firstEmpty = Array.from(document.querySelectorAll('#lesson-dynamic-container .lvl-input, #lesson-dynamic-container .carry-input')).find(i => i.value.trim() === '');
    if (firstEmpty) firstEmpty.focus();
    else return;
  }
  const inp = lastFocusedInput;
  inp.focus();

  if (key === 'BACKSPACE') {
    if (inp.value.length > 0) {
      inp.value = inp.value.slice(0, -1);
      inp.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  if (key === 'NEXT') {
    const allInputs = Array.from(document.querySelectorAll('#lesson-dynamic-container .lvl-input, #lesson-dynamic-container .carry-input'));
    const idx = allInputs.indexOf(inp);
    if (idx >= 0 && idx + 1 < allInputs.length) allInputs[idx + 1].focus();
    return;
  }

  const maxLen = parseInt(inp.getAttribute('maxlength') || '2', 10);
  if (inp.dataset.type === 'wp-op') {
    if (key === '+' || key === '-') {
      inp.value = key;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  if (/^[0-9]$/.test(key)) {
    inp.value = (inp.value.length >= maxLen) ? key : (inp.value + key);
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

function handleContainerInput(e) {
  const target = e.target;
  if (!target || (!target.classList.contains('lvl-input') && !target.classList.contains('carry-input'))) return;
  const tType = target.dataset.type;

  if (tType === 'vert-digit' || tType === 'digit' || target.dataset.role === 'carry') {
    target.value = target.value.replace(/[^0-9]/g, '').slice(-1);
  } else if (tType === 'wp-op') {
    target.value = target.value.replace(/＋/g, '+').replace(/–|—|−/g, '-').replace(/[^+\-]/g, '').slice(-1);
  } else {
    target.value = target.value.replace(/[^0-9]/g, '');
  }

  const draftKey = target.dataset.draftKey;
  if (draftKey) {
    const lvKey = 'lv' + currentLevel;
    if (!currentUser.drafts[lvKey]) currentUser.drafts[lvKey] = {};
    currentUser.drafts[lvKey][draftKey] = target.value;
    saveDataDebounced();
  }

  // Tự động nhảy con trỏ Phải -> Trái trên thẻ Đặt Tính Dọc
  const vCard = target.closest('.std-vertical-card');
  if (vCard && /^[0-9]$/.test(target.value)) {
    if (target.dataset.col === 'ones') {
      const carryInp = vCard.querySelector('input[data-role="carry"]');
      if (carryInp) carryInp.focus();
    } else if (target.dataset.role === 'carry') {
      const tensInp = vCard.querySelector('input[data-col="tens"]');
      if (tensInp) tensInp.focus();
    }
    return;
  }

  // Tự động nhảy qua 2 ô trong thẻ Giải mã (.puzzle-card)
  const puzCard = target.closest('.puzzle-card');
  if (puzCard && /^[0-9]$/.test(target.value)) {
    const cardInputs = Array.from(puzCard.querySelectorAll('.lvl-input[data-type="digit"]'));
    if (cardInputs.length === 2) {
      const otherInp = cardInputs.find(i => i !== target && i.value.trim() === '');
      if (otherInp) otherInp.focus();
    }
    return;
  }

  // Tự động nhảy qua 4 ô bài toán lời văn
  const wpCard = target.closest('.word-problem-card');
  if (wpCard) {
    if (tType === 'wp-n1' && target.value.length === 2) {
      const opInp = wpCard.querySelector('input[data-type="wp-op"]');
      if (opInp) opInp.focus();
    } else if (tType === 'wp-op' && (target.value === '+' || target.value === '-')) {
      const n2Inp = wpCard.querySelector('input[data-type="wp-n2"]');
      if (n2Inp) n2Inp.focus();
    } else if (tType === 'wp-n2' && target.value.length === 2) {
      const sumInp = wpCard.querySelector('input[data-type="wp-sum"]');
      if (sumInp) sumInp.focus();
    } else if (tType === 'wp-sum' && target.value.length === 2) {
      const ansInp = wpCard.querySelector('input[data-type="ans"]');
      if (ansInp) ansInp.focus();
    }
  }
}

function handleContainerKeydown(e) {
  const target = e.target;
  if (!target) return;
  const card = target.closest('.std-vertical-card');
  if (card && e.key === 'Backspace' && target.value === '') {
    if (target.dataset.col === 'tens') {
      const carryInp = card.querySelector('input[data-role="carry"]');
      if (carryInp) { e.preventDefault(); carryInp.focus(); }
    } else if (target.dataset.role === 'carry') {
      const onesInp = card.querySelector('input[data-col="ones"]');
      if (onesInp) { e.preventDefault(); onesInp.focus(); }
    }
  }
}

function handleContainerFocusIn(e) {
  const target = e.target;
  if (!target || target.tagName !== 'INPUT') return;
  if (target.id && target.id.startsWith('header-')) return;
  lastFocusedInput = target;
  target.classList.add('rtl-step-active');
  if (typeof isKeypadVisible !== 'undefined' && isKeypadVisible) {
    document.getElementById('custom-math-keypad').classList.remove('hidden');
  }
}

function handleContainerFocusOut(e) {
  const target = e.target;
  if (!target || target.tagName !== 'INPUT') return;
  target.classList.remove('rtl-step-active');
}

// 5. HỆ THỐNG CHẤM ĐIỂM ĐA CHIỀU (3 MÀU) & THƯỞNG SAO
function applyFeedbackStyle(input, status) {
  const inputType = input.dataset.type;
  const isCarry = input.dataset.role === 'carry';

  input.classList.remove(
    'text-blue-800', 'text-blue-900', 'text-rose-600', 'bg-white', 'bg-white/90', 'bg-transparent',
    'border-sky-400', 'border-dashed', 'border-solid',
    'text-rose-700', 'bg-rose-100', 'border-rose-500', 'animate-bounce',
    'text-emerald-700', 'bg-emerald-100', 'border-emerald-500',
    'text-amber-800', 'bg-amber-50/90', 'bg-amber-100', 'border-amber-400', 'border-amber-500'
  );

  if (status === 'correct') {
    input.classList.add('bg-emerald-100', 'text-emerald-700');
    input.dataset.lastStatus = 'correct';
    if (input.classList.contains('oly-blank')) input.style.borderBottomColor = '#10b981';
    else if (isCarry || inputType === 'digit' || inputType === 'vert-digit') input.classList.add('border-emerald-500', 'border-solid');
  } else if (status === 'empty') {
    input.classList.add('bg-amber-100', 'text-amber-800');
    input.dataset.lastStatus = 'empty';
    if (input.classList.contains('oly-blank')) input.style.borderBottomColor = '#f59e0b';
    else if (isCarry || inputType === 'digit' || inputType === 'vert-digit') input.classList.add('border-amber-500', 'border-dashed');
    else input.classList.add('border-amber-400');
  } else {
    input.classList.add('bg-rose-100', 'text-rose-700');
    input.dataset.lastStatus = 'wrong';
    if (input.classList.contains('oly-blank')) input.style.borderBottomColor = '#f43f5e';
    else if (isCarry || inputType === 'digit' || inputType === 'vert-digit') input.classList.add('border-rose-500', 'border-solid');
  }
}

function evaluateScope(scopeElement) {
  const allLvlInputs = scopeElement.querySelectorAll('.lvl-input');
  const allCarryInputs = scopeElement.querySelectorAll('.carry-input');
  let correctCount = 0, emptyCount = 0, wrongCount = 0;
  const total = allLvlInputs.length + allCarryInputs.length;

  // 1. Chấm các ô số cơ bản
  allLvlInputs.forEach(input => {
    const inputType = input.dataset.type;
    if (inputType === 'digit' || inputType.startsWith('wp-')) return;
    const expected = input.dataset.ans;
    const rawVal = input.value.trim();
    if (rawVal === '') { emptyCount++; applyFeedbackStyle(input, 'empty'); return; }
    const isCorrect = (inputType === 'vert-digit')
      ? (rawVal === expected)
      : (parseInt(rawVal.replace(/[^0-9]/g, ''), 10) === parseInt(expected.replace(/[^0-9]/g, ''), 10));
    if (isCorrect) { correctCount++; applyFeedbackStyle(input, 'correct'); }
    else { wrongCount++; applyFeedbackStyle(input, 'wrong'); }
  });

  // 1b. Chấm Ô Nhớ (.carry-input)
  scopeElement.querySelectorAll('.std-vertical-card').forEach(card => {
    const carryInp = card.querySelector('input[data-role="carry"]');
    if (!carryInp) return;
    const cVal = carryInp.value.trim();
    const expectedCarry = carryInp.dataset.expected || '1';
    if (cVal === expectedCarry) { correctCount++; applyFeedbackStyle(carryInp, 'correct'); }
    else if (cVal === '') { emptyCount++; applyFeedbackStyle(carryInp, 'empty'); }
    else { wrongCount++; applyFeedbackStyle(carryInp, 'wrong'); }
  });

  // 2. Chấm 4 ô lời văn (.word-problem-card) kèm kiểm tra đẳng thức liên kết
  scopeElement.querySelectorAll('.word-problem-card').forEach(wpCard => {
    const expN1 = parseInt(wpCard.dataset.n1, 10);
    const expN2 = parseInt(wpCard.dataset.n2, 10);
    const expOp = wpCard.dataset.op;
    const expSum = parseInt(wpCard.dataset.sum, 10);

    const inpN1 = wpCard.querySelector('input[data-type="wp-n1"]');
    const inpOp = wpCard.querySelector('input[data-type="wp-op"]');
    const inpN2 = wpCard.querySelector('input[data-type="wp-n2"]');
    const inpSum = wpCard.querySelector('input[data-type="wp-sum"]');

    const v1Raw = inpN1 ? inpN1.value.trim() : '';
    const vOpRaw = inpOp ? inpOp.value.trim() : '';
    const v2Raw = inpN2 ? inpN2.value.trim() : '';
    const vSumRaw = inpSum ? inpSum.value.trim() : '';

    const v1 = v1Raw !== '' ? parseInt(v1Raw, 10) : null;
    const v2 = v2Raw !== '' ? parseInt(v2Raw, 10) : null;
    let operandsPairValid = false;

    if (v1 !== null && v2 !== null) {
      if ((v1 === expN1 && v2 === expN2) || (v1 === expN2 && v2 === expN1)) {
        operandsPairValid = true;
        correctCount += 2;
        applyFeedbackStyle(inpN1, 'correct');
        applyFeedbackStyle(inpN2, 'correct');
      } else {
        if (v1 === expN1 || v1 === expN2) { correctCount++; applyFeedbackStyle(inpN1, 'correct'); wrongCount++; applyFeedbackStyle(inpN2, 'wrong'); }
        else {
          wrongCount++; applyFeedbackStyle(inpN1, 'wrong');
          if (v2 === expN1 || v2 === expN2) { correctCount++; applyFeedbackStyle(inpN2, 'correct'); }
          else { wrongCount++; applyFeedbackStyle(inpN2, 'wrong'); }
        }
      }
    } else {
      if (inpN1) {
        if (v1 === null) { emptyCount++; applyFeedbackStyle(inpN1, 'empty'); }
        else if (v1 === expN1 || v1 === expN2) { correctCount++; applyFeedbackStyle(inpN1, 'correct'); }
        else { wrongCount++; applyFeedbackStyle(inpN1, 'wrong'); }
      }
      if (inpN2) {
        if (v2 === null) { emptyCount++; applyFeedbackStyle(inpN2, 'empty'); }
        else if (v2 === expN1 || v2 === expN2) { correctCount++; applyFeedbackStyle(inpN2, 'correct'); }
        else { wrongCount++; applyFeedbackStyle(inpN2, 'wrong'); }
      }
    }

    let opValid = false;
    if (inpOp) {
      if (vOpRaw === '') { emptyCount++; applyFeedbackStyle(inpOp, 'empty'); }
      else if (vOpRaw === expOp) { opValid = true; correctCount++; applyFeedbackStyle(inpOp, 'correct'); }
      else { wrongCount++; applyFeedbackStyle(inpOp, 'wrong'); }
    }

    if (inpSum) {
      if (vSumRaw === '') { emptyCount++; applyFeedbackStyle(inpSum, 'empty'); }
      else {
        const vSum = parseInt(vSumRaw, 10);
        const hasFullLeft = (v1 !== null && v2 !== null && vOpRaw !== '');
        const eqConsistent = !hasFullLeft || (opValid && operandsPairValid && (v1 + v2 === vSum));
        if (vSum === expSum && eqConsistent) { correctCount++; applyFeedbackStyle(inpSum, 'correct'); }
        else { wrongCount++; applyFeedbackStyle(inpSum, 'wrong'); }
      }
    }
  });

  // 3. Chấm các thẻ Giải mã chữ số (.puzzle-card) ở LV3
  scopeElement.querySelectorAll('.puzzle-card').forEach(card => {
    const cardInputs = Array.from(card.querySelectorAll('.lvl-input[data-type="digit"]'));
    const targetSum = parseInt(card.dataset.sum, 10);
    const uSum = targetSum % 10;
    const tSum = Math.floor(targetSum / 10);
    const neededOnesSum = 10 + uSum;
    const neededTensSum = tSum - 1;

    const isSameColTwoInputs = (cardInputs.length === 2 && cardInputs[0].dataset.col === cardInputs[1].dataset.col);
    if (isSameColTwoInputs) {
      const col = parseInt(cardInputs[0].dataset.col, 10);
      const raw0 = cardInputs[0].value.trim();
      const raw1 = cardInputs[1].value.trim();
      const has0 = /^[0-9]$/.test(raw0), has1 = /^[0-9]$/.test(raw1);
      const d0 = has0 ? parseInt(raw0, 10) : null;
      const d1 = has1 ? parseInt(raw1, 10) : null;
      const inDom = (d) => d !== null && (col === 1 ? (d >= neededOnesSum - 9 && d <= 9) : (d >= 1 && d <= neededTensSum - 1));

      if (has0 && has1) {
        const pairValid = (col === 1) ? (d0 + d1 === neededOnesSum) : (d0 >= 1 && d1 >= 1 && d0 + d1 === neededTensSum);
        if (pairValid) {
          correctCount += 2;
          applyFeedbackStyle(cardInputs[0], 'correct');
          applyFeedbackStyle(cardInputs[1], 'correct');
        } else {
          if (inDom(d0)) { correctCount++; applyFeedbackStyle(cardInputs[0], 'correct'); wrongCount++; applyFeedbackStyle(cardInputs[1], 'wrong'); }
          else if (inDom(d1)) { wrongCount++; applyFeedbackStyle(cardInputs[0], 'wrong'); correctCount++; applyFeedbackStyle(cardInputs[1], 'correct'); }
          else { wrongCount += 2; applyFeedbackStyle(cardInputs[0], 'wrong'); applyFeedbackStyle(cardInputs[1], 'wrong'); }
        }
      } else {
        cardInputs.forEach(inp => {
          const r = inp.value.trim();
          if (r === '') { emptyCount++; applyFeedbackStyle(inp, 'empty'); }
          else if (inDom(parseInt(r, 10))) { correctCount++; applyFeedbackStyle(inp, 'correct'); }
          else { wrongCount++; applyFeedbackStyle(inp, 'wrong'); }
        });
      }
    } else {
      cardInputs.forEach(inp => {
        const rawVal = inp.value.trim();
        const col = parseInt(inp.dataset.col, 10);
        const row = parseInt(inp.dataset.row, 10);
        const otherRow = row === 0 ? 1 : 0;
        const fixedStr = card.dataset[`r${otherRow}${col}`];
        const expectedDigit = (fixedStr !== undefined && fixedStr !== '')
          ? (col === 1 ? neededOnesSum - parseInt(fixedStr, 10) : neededTensSum - parseInt(fixedStr, 10))
          : parseInt(inp.dataset.ans, 10);

        if (rawVal === '') { emptyCount++; applyFeedbackStyle(inp, 'empty'); }
        else if (/^[0-9]$/.test(rawVal) && parseInt(rawVal, 10) === expectedDigit) { correctCount++; applyFeedbackStyle(inp, 'correct'); }
        else { wrongCount++; applyFeedbackStyle(inp, 'wrong'); }
      });
    }
  });

  // 4. Thưởng +2 Sao cho mỗi câu hoàn thành đúng
  let newlyRewardedStars = 0;
  scopeElement.querySelectorAll('[data-prob-id]').forEach(probEl => {
    const probId = probEl.dataset.probId;
    const reqInputs = Array.from(probEl.querySelectorAll('.lvl-input, .carry-input'));
    if (reqInputs.length === 0) return;
    if (reqInputs.every(inp => inp.dataset.lastStatus === 'correct')) {
      const badge = probEl.querySelector('.prob-star-badge');
      if (badge) badge.classList.remove('hidden');
      if (!currentUser.rewardedItems[probId]) {
        currentUser.rewardedItems[probId] = true;
        currentUser.stars += 2;
        newlyRewardedStars += 2;
      }
    }
  });

  saveDataImmediate();
  updateDashboardUI();
  return { correctCount, emptyCount, wrongCount, total, newlyRewardedStars };
}

// ============================================================================
// BỘ SINH ĐỀ TOÁN ĐỘNG (FISHER-YATES SHUFFLE - O(1), 0% TRÙNG LẶP)
// ============================================================================

let regroupingPool = [];

// Khởi tạo không gian mẫu: Tất cả phép cộng có nhớ trong phạm vi 100
function initRegroupingPool() {
  const pool = [];
  for (let n1 = 11; n1 <= 88; n1++) {
    for (let n2 = 11; n2 <= 88; n2++) {
      if (n1 + n2 <= 99) {
        let u1 = n1 % 10;
        let u2 = n2 % 10;
        if (u1 + u2 >= 10) { // Điều kiện cộng qua 10 ở hàng đơn vị
          pool.push({ n1: n1, n2: n2, sum: n1 + n2 });
        }
      }
    }
  }
  
  // Thuật toán xáo trộn Fisher-Yates (Hoán đổi ngẫu nhiên từ cuối lên đầu)
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  
  regroupingPool = pool;
}

// Rút ra 1 cặp số duy nhất bằng phương thức pop() - O(1)
function getUniqueRegroupingPair() {
  if (regroupingPool.length === 0) {
    initRegroupingPool(); // Tự động nạp lại khi cạn kiệt kho đề
  }
  return regroupingPool.pop();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Hàm xây dựng cấu trúc thẻ Giải mã chữ số (Puzzle)
function buildPuzzleItem(label, theme, pair, maskMode) {
  const t1 = String(Math.floor(pair.n1 / 10));
  const u1 = String(pair.n1 % 10);
  const t2 = String(Math.floor(pair.n2 / 10));
  const u2 = String(pair.n2 % 10);
  const tS = String(Math.floor(pair.sum / 10));
  const uS = String(pair.sum % 10);

  let r0 = [t1, u1], r1 = [t2, u2];

  if (maskMode === 'ones_single_r0') r0[1] = { ans: parseInt(u1, 10) };
  else if (maskMode === 'ones_single_r1') r1[1] = { ans: parseInt(u2, 10) };
  else if (maskMode === 'ones_both') { r0[1] = { ans: parseInt(u1, 10) }; r1[1] = { ans: parseInt(u2, 10) }; }
  else if (maskMode === 'tens_single_r0') r0[0] = { ans: parseInt(t1, 10) };
  else if (maskMode === 'tens_single_r1') r1[0] = { ans: parseInt(t2, 10) };
  else if (maskMode === 'tens_both') { r0[0] = { ans: parseInt(t1, 10) }; r1[0] = { ans: parseInt(t2, 10) }; }
  else if (maskMode === 'mixed_diag1') { r0[1] = { ans: parseInt(u1, 10) }; r1[0] = { ans: parseInt(t2, 10) }; }
  else if (maskMode === 'mixed_diag2') { r0[0] = { ans: parseInt(t1, 10) }; r1[1] = { ans: parseInt(u2, 10) }; }
  else if (maskMode === 'mixed_row0') { r0[0] = { ans: parseInt(t1, 10) }; r0[1] = { ans: parseInt(u1, 10) }; }
  else if (maskMode === 'mixed_row1') { r1[0] = { ans: parseInt(t2, 10) }; r1[1] = { ans: parseInt(u2, 10) }; }

  return { l: label, theme: theme, op: '+', sum: pair.sum, rows: [r0, r1, [tS, uS]] };
}

// Thay số mới vào Bài toán lời văn mà không làm hỏng cú pháp tiếng Việt
function updateWordProblemItemNumbers(wpItem, newN1, newN2) {
  const oldN1 = wpItem.n1;
  const oldN2 = wpItem.n2;
  const newSum = newN1 + newN2;

  wpItem.desc = wpItem.desc.replace(new RegExp(`\\b${oldN1}\\b`), '___N1___').replace(new RegExp(`\\b${oldN2}\\b`), String(newN2)).replace('___N1___', String(newN1));
  if (wpItem.ttsText) wpItem.ttsText = wpItem.ttsText.replace(new RegExp(`\\b${oldN1}\\b`), '___N1___').replace(new RegExp(`\\b${oldN2}\\b`), String(newN2)).replace('___N1___', String(newN1));
  if (wpItem.tomTat) wpItem.tomTat = wpItem.tomTat.replace(new RegExp(`\\b${oldN1}\\b`), '___N1___').replace(new RegExp(`\\b${oldN2}\\b`), String(newN2)).replace('___N1___', String(newN1));

  wpItem.n1 = newN1;
  wpItem.n2 = newN2;
  wpItem.ansNum = newSum;
}

function clearRewardedKeysByPrefix(prefix) {
  if (!currentUser.rewardedItems) return;
  Object.keys(currentUser.rewardedItems).forEach(k => {
    if (k.startsWith(prefix)) {
      delete currentUser.rewardedItems[k];
    }
  });
}

// Đổ dữ liệu ngẫu nhiên vào dữ liệu bài học
function randomizeSectionData(sectionId) {
  const labels6 = ['a)', 'b)', 'c)', 'd)', 'e)', 'g)'];
  const labels10 = ['a)', 'b)', 'c)', 'd)', 'e)', 'f)', 'g)', 'h)', 'i)', 'k)'];

  if (sectionId === 'lv1_ex1') {
    clearRewardedKeysByPrefix('lv1_ex1_');
    window.LESSON_DATA.lv1.ex1 = labels6.map((l, idx) => {
      const p = getUniqueRegroupingPair();
      return { l, n1: p.n1, n2: p.n2, op: '+', ans: p.sum, theme: THEME_KEYS[idx % THEME_KEYS.length] };
    });
  } else if (sectionId === 'lv1_ex2') {
    clearRewardedKeysByPrefix('lv1_ex2_');
    const tA = randInt(2, 5), uA = randInt(4, 8);
    const nA = tA * 10 + uA;
    const compA = 10 - uA;
    const extraA = compA + 10;
    const extraA2 = extraA + randInt(1, 3);
    window.LESSON_DATA.lv1.ex2[0].items = [
      { c1: String(nA), op: '+', c2: String(compA), eq: '=', ans: nA + compA },
      { c1: String(nA), op: '+', c2: String(extraA), eq: '=', ans: nA + extraA },
      { c1: String(nA), op: '+', c2: String(extraA2), eq: '=', ans: nA + extraA2 }
    ];
    const pSwap = getUniqueRegroupingPair();
    const pExtra = getUniqueRegroupingPair();
    window.LESSON_DATA.lv1.ex2[1].items = [
      { c1: String(pSwap.n1), op: '+', c2: String(pSwap.n2), eq: '=', ans: pSwap.sum },
      { c1: String(pSwap.n2), op: '+', c2: String(pSwap.n1), eq: '=', ans: pSwap.sum },
      { c1: String(pExtra.n1), op: '+', c2: String(pExtra.n2), eq: '=', ans: pExtra.sum }
    ];
    window.LESSON_DATA.lv1.ex2[2].items = [0, 1, 2].map(() => {
      const uFirst = randInt(2, 8);
      const uSecond = 10 - uFirst;
      const tFirst = randInt(1, 4);
      const tSecond = randInt(1, 3);
      const a1 = tFirst * 10 + uFirst;
      const a2 = tSecond * 10 + uSecond;
      const a3 = randInt(3, 9);
      return { c1: `${a1} + ${a2}`, op: '+', c2: String(a3), eq: '=', ans: a1 + a2 + a3 };
    });
  } else if (sectionId === 'lv1_ex3') {
    clearRewardedKeysByPrefix('lv1_ex3_');
    window.LESSON_DATA.lv1.ex3.forEach(item => {
      const p = getUniqueRegroupingPair();
      updateWordProblemItemNumbers(item, p.n1, p.n2);
    });
  } else if (sectionId === 'lv2_all') {
    clearRewardedKeysByPrefix('lv2_prob_');
    window.LESSON_DATA.lv2.problems.forEach(item => {
      const p = getUniqueRegroupingPair();
      updateWordProblemItemNumbers(item, p.n1, p.n2);
    });
  } else if (sectionId === 'lv3_ex1') {
    clearRewardedKeysByPrefix('lv3_ex1_');
    window.LESSON_DATA.lv3.ex1 = labels10.map((l, idx) => {
      const p = getUniqueRegroupingPair();
      return { l, n1: p.n1, n2: p.n2, op: '+', ans: p.sum, theme: THEME_KEYS[idx % THEME_KEYS.length] };
    });
  } else if (sectionId === 'lv3_ex2') {
    clearRewardedKeysByPrefix('lv3_ex2_');
    const modesEx2 = ['ones_single_r0', 'ones_both', 'ones_single_r1', 'ones_single_r0', 'ones_both', 'ones_single_r1'];
    window.LESSON_DATA.lv3.ex2 = labels6.map((l, idx) => {
      const p = getUniqueRegroupingPair();
      return buildPuzzleItem(l, THEME_KEYS[idx % THEME_KEYS.length], p, modesEx2[idx]);
    });
  } else if (sectionId === 'lv3_ex3') {
    clearRewardedKeysByPrefix('lv3_ex3_');
    const modesEx3 = ['tens_single_r1', 'tens_single_r0', 'tens_both', 'tens_single_r1', 'tens_single_r0', 'tens_both'];
    window.LESSON_DATA.lv3.ex3 = labels6.map((l, idx) => {
      const p = getUniqueRegroupingPair();
      return buildPuzzleItem(l, THEME_KEYS[(idx + 1) % THEME_KEYS.length], p, modesEx3[idx]);
    });
  } else if (sectionId === 'lv3_ex4') {
    clearRewardedKeysByPrefix('lv3_ex4_');
    const modesEx4 = ['mixed_diag1', 'mixed_row0', 'mixed_diag2', 'mixed_row1', 'mixed_diag1', 'mixed_diag2'];
    window.LESSON_DATA.lv3.ex4 = labels6.map((l, idx) => {
      const p = getUniqueRegroupingPair();
      return buildPuzzleItem(l, THEME_KEYS[(idx + 2) % THEME_KEYS.length], p, modesEx4[idx]);
    });
  }
}

// Chạy xáo trộn, vẽ lại giao diện bài học mới
function randomizeSection(sectionId) {
  randomizeSectionData(sectionId);
  resetSection(sectionId);
  renderCurrentLevelDOM(currentLevel); // Vẽ lại HTML với dữ liệu mới
  
  const secEl = document.getElementById(`sec-${sectionId}`);
  if (secEl) secEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const msgEl = document.getElementById(`msg-sec-${sectionId}`);
  if (msgEl) {
    msgEl.className = "text-sm font-baloo font-extrabold text-indigo-600";
    msgEl.innerHTML = `🎲 Đã tạo bộ đề luyện tập mới cho bài này! Bé bắt đầu thử sức để nhận thêm Sao nhé!`;
  }
  playCuteSound('correct');
}

// Bấm nút Đổi Đề Mới cho toàn bộ phiếu
function randomizeCurrentLevel() {
  if (currentLevel === 1) {
    randomizeSectionData('lv1_ex1');
    randomizeSectionData('lv1_ex2');
    randomizeSectionData('lv1_ex3');
  } else if (currentLevel === 2) {
    randomizeSectionData('lv2_all');
  } else if (currentLevel === 3) {
    randomizeSectionData('lv3_ex1');
    randomizeSectionData('lv3_ex2');
    randomizeSectionData('lv3_ex3');
    randomizeSectionData('lv3_ex4');
  }
  
  resetLevel();
  renderCurrentLevelDOM(currentLevel); 
  
  const msg = document.getElementById('msg-grader');
  if (msg) {
    msg.className = "text-center font-baloo font-extrabold text-lg text-indigo-600 mt-3";
    msg.innerHTML = `🎲 Đã đổi bộ số cộng có nhớ mới cho toàn bộ phiếu LV${currentLevel}! Chúc bé làm bài thật vui!`;
  }
  playCuteSound('correct');
}

function handleLevelSuccess() {
  const lvKey = 'lv' + currentLevel;
  if (!currentUser.progress['toan_b20'][lvKey]) {
    currentUser.stars += 10;
    currentUser.progress['toan_b20'][lvKey] = true;
    saveDataImmediate();
    updateDashboardUI();
  }
  const modal = document.getElementById('modal-success');
  const btnNext = document.getElementById('btn-next-level');
  if (currentLevel < 3) {
    btnNext.innerHTML = `<span>🚀</span> CHƠI TIẾP CẤP ĐỘ ${currentLevel + 1}`;
    btnNext.classList.remove('hidden');
  } else {
    btnNext.classList.add('hidden');
  }
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeSuccessModal() {
  document.getElementById('modal-success').classList.add('hidden');
  document.getElementById('modal-success').classList.remove('flex');
}

function goToNextLevel() {
  closeSuccessModal();
  switchLevel(currentLevel + 1, true);
}

// SỰ KIỆN KHỞI CHẠY (Bao gồm nạp kho đề Fisher-Yates ngay khi mở Web)
window.addEventListener('DOMContentLoaded', () => {
    initRegroupingPool(); // Khởi tạo và xóc đều 100% kho đề
    initApp();            // Khởi chạy App
});
